name: python app to docker

on:
  push:
    branches: [main]
    paths:
      - "docker/app1-hello/python/**"
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: install dependencies
        working-directory: docker/app1-hello/python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: run smoke tests (if any)
        working-directory: docker/app1-hello/python
        run: |
          python -m py_compile main.py

  docker-build:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: docker/app1-hello/python
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-python:latest

  deploy-to-eks:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"
      - name: update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ap-south-1

      - name: deploy to eks
        run: |

          kubectl apply -f docker/app1-hello/python/k8s/deployment.yml
